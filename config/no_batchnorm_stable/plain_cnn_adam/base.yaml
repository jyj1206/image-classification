_base_: [../../base.yaml, ../base.yaml]

experiment:
  result_root: results/no_batchnorm_stable_plain_cnn_adam

model:
  name: cifar10_plain_filter_net
  args:
    input_channels: 3
    use_batchnorm: false

trainer:
  epochs: 100
  optimizer:
    name: adam
    lr: 0.001
    betas: [0.9, 0.999]
    weight_decay: 0.0005
  scheduler:
    name: cosine
    eta_min: 0.00001
  gradient_clip:
    enabled: true
    max_norm: 5.0
  stop_on_non_finite: true
